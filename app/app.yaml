command:
  - "streamlit"
  - "run"
  - "app.py"
  - "--server.port"
  - "8501"

env:
  - name: "DATABRICKS_HOST"
    valueFrom: "workspace-url"
  - name: "DATABRICKS_SQL_WAREHOUSE_HTTP_PATH"
    value: "/sql/1.0/warehouses/auto"

permissions:
  - user: "rajneesh.arora@databricks.com"
    level: "CAN_MANAGE"

resources:
  memory: "2Gi"
  cpu: "1"